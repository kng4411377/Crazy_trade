# Trade Bot Configuration
#
# ⚠️  IMPORTANT: API keys are NOT stored here!
# API keys are in secrets.yaml (which is in .gitignore)
#
# To set up:
#   1. cp secrets.yaml.example secrets.yaml
#   2. Edit secrets.yaml with your real API keys
#   3. Never commit secrets.yaml to Git!
#
# See docs/SETUP_SECRETS.md for detailed instructions

mode: "paper"          # "paper" | "live" (determines paper vs live Alpaca endpoint)

# Stock watchlist (trades during market hours only)
watchlist: 
  - "BBBY"
  - "BYND"
  - "UUUU"
  - "OKLO"
  - "GME"
  - "AMC"
  - "BB"
  - "IOVA"
  - "WEN"
  - "BULL"
  - "OPEN"
  - "KSS"
  - "DNUT"
  - "GPRO"
  - "HTZ"
  - "PTON"
  - "QS"

# Crypto watchlist (trades 24/7)
# Alpaca format: SYMBOL or SYMBOL/USD (USD will be added automatically)
# crypto_watchlist:
#   - "BTC/USD"     # Bitcoin (most liquid)
#   - "ETH/USD"     # Ethereum (most liquid)
#   - "DOGE/USD"    # Dogecoin (high volatility! ✅ supported)
#   - "SHIB/USD"    # Shiba Inu (high volatility! ✅ supported)
  # Other top cryptos supported on Alpaca:
  # - "SOL/USD"   # Solana
  # - "LINK/USD"  # Chainlink
  # - "XRP/USD"   # Ripple
  # - "LTC/USD"   # Litecoin
  # - "AVAX/USD"  # Avalanche
  # - "UNI/USD"   # Uniswap

allocation:
  # Dollar-based sizing to cap risk per symbol and overall
  total_usd_cap: 50000
  per_symbol_usd: 1000         # default per-symbol budget
  per_symbol_override: {}       # e.g., {"TSLA": 1500}
  min_cash_reserve_percent: 10
  allow_fractional: false       # MUST be true for crypto! Set to true if trading crypto_watchlist

entries:
  type: "buy_stop"              # "buy_stop" | "buy_stop_limit"
  buy_stop_pct_above_last: 5.0
  stop_limit_max_slip_pct: 1.0  # only used if type == buy_stop_limit
  tif: "DAY"                    # Time-in-force: "DAY" (cancel at close) | "GTC" (good till cancelled)
                                 # "DAY" is typical for stocks (auto-cancels unfilled orders at market close)
                                 # "GTC" keeps orders active until filled or manually cancelled
  cancel_at_close: true
  rearm_next_session: true

stops:
  trailing_stop_pct: 10.0
  use_trailing_limit: false     # if true, convert to TRAIL LIMIT with limit offset
  trail_limit_offset_pct: 0.2   # if above is true
  tif: "GTC"                    # Time-in-force: "GTC" (good till cancelled) | "DAY" (cancel at close)
                                 # "GTC" is typical for trailing stops (stays active after entry fills)
                                 # Use "DAY" if you want stops to cancel at market close

hours:
  calendar: "XNYS"
  allow_pre_market: false
  allow_after_hours: false
  skip_first_minutes: 5       # Skip first 5 minutes after open (avoid volatility)
  skip_last_minutes: 10       # Skip last 10 minutes before close (avoid volatility)

cooldowns:
  after_stopout_minutes: 1440   # Wait at least 1 day (1440 min) before re-entering after stop-out
                                 # Prevents revenge trading and overtrading
                                 # Old default was 20 minutes (too short)

polling:
  price_seconds: 10
  orders_seconds: 15
  keepalive_seconds: 300     # Ping Alpaca every 5 minutes to keep connection alive
  event_check_seconds: 5     # Check for order updates/fills (Alpaca REST polling)

risk:
  max_total_exposure_usd: 20000
  max_symbol_exposure_usd: 2000
  max_daily_loss_pct: 3.0     # Circuit breaker: Stop trading if daily loss > 3%
  max_daily_loss_usd: 500     # Circuit breaker: Stop trading if daily loss > $500
  max_concurrent_positions: 5  # Max 5 positions at once

persistence:
  db_url: "sqlite:///bot.db"

logging:
  level: "INFO"

alerts:
  webhook: null

